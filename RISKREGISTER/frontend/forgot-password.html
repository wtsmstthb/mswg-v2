<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password - MSWG Platform Portal</title>
  <link rel="stylesheet" href="shell.css">
  <style>
    .auth-links { display:flex; flex-wrap:wrap; gap:12px 18px; margin-top:20px; }
    .auth-links a { color:var(--brand, #1b2559); font-weight:700; }
  </style>
</head>
<body>
  <main class="access-message">
    <div class="profile-page-card">
      <div class="eyebrow">MSWG Internal Systems</div>
      <h1>Reset your password</h1>
      <p class="subtitle">Continue to the secure account service. A reset code will only be sent to the verified email address on your MSWG account.</p>
      <p style="margin-top:18px;"><button class="btn-primary" id="resetBtn">Continue to password reset</button></p>
      <p class="subtitle" id="resetMessage" role="status" style="margin-top:14px;color:var(--high);"></p>
      <nav class="auth-links" aria-label="Account help">
        <a href="login.html">Back to sign in</a>
        <a href="signup.html">Request an account</a>
        <a href="access-denied.html">Access denied?</a>
      </nav>
    </div>
  </main>
  <script src="config.js"></script>
  <script>
    document.getElementById("resetBtn").addEventListener("click", () => {
      const config = window.APP_CONFIG.cognito;
      if (!config.hostedUiDomain || !config.clientId || !config.redirectUri) {
        document.getElementById("resetMessage").textContent =
          "Password reset is not connected in this local demonstration. Please contact the MSWG system administrator.";
        return;
      }
      const url = new URL("/forgotPassword", config.hostedUiDomain);
      url.searchParams.set("client_id", config.clientId);
      url.searchParams.set("response_type", "code");
      url.searchParams.set("scope", "openid email profile");
      url.searchParams.set("redirect_uri", config.redirectUri);
      window.location.assign(url.toString());
    });
  </script>
</body>
</html>
